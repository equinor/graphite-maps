name: Build and test Linux
permissions:
  contents: read

on:
 push:
   branches:
     - main
   tags: "*"
 pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-wheels-linux:
    name: Build 🛞 (${{ matrix.python-version }}, ${{ matrix.arch }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13', '3.14', '3.15' ]
        arch: [ x86_64, aarch64 ]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set IS_TAG environment variable
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IS_TAG=true" >> $GITHUB_ENV
          else
            echo "IS_TAG=false" >> $GITHUB_ENV
          fi

      - name: build-wheels-linux
        uses: docker://quay.io/pypa/manylinux_2_28
        env:
          IS_TAG: ${{ env.IS_TAG }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

        with:
          entrypoint: /bin/bash
          args: '-c "sh wheel_build_scripts/build_wheels_linux.sh"'

      - name: Upload wheel as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Python ${{ matrix.python-version }} ${{ matrix.arch }} wheel
          path: |
            graphite*.whl

  test-linux:
    name: test-linux (${{ matrix.python-version }}${{ matrix.arch != 'x86_64' && format(', {0}', matrix.arch) || '' }})
    needs: [build-wheels-linux]
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13', '3.14', '3.15' ]
        arch: [ x86_64, aarch64 ]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "Python ${{ matrix.python-version }} ${{ matrix.arch }} wheel"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --no-install-project --no-install-package scikit-sparse
      - name: Install wheel
        run: |
          # Find the downloaded wheel file
          wheel_file=$(find . -name "graphite*.whl" -print -quit)

          echo "Found wheel file @ $wheel_file"

          # Install the wheel
          uv pip install --python .venv/bin/python --no-deps "$wheel_file"

      - name: Run EnIF unit tests
        run: |
          uv run --no-sync pytest
          uv run --no-sync pytest graphite_maps --doctest-modules

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels-linux, test-linux]
    environment: pypi
    permissions:
      id-token: write

    # If this is a tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')

    steps:
      - name: Get wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Move to dist/
        run: |
          mkdir dist
          find artifacts -name "*.whl" -exec mv '{}' dist/ \;

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
